<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account — Nkomazi Connect</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/lucide@latest"></script><style>:root{--navy:#092e3c;--teal:#008e7c;--line:#e3ebed;--muted:#6c8088}*{box-sizing:border-box}body{margin:0;background:#f5f8f8;color:#18333c;font:14px 'DM Sans',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(25px,calc((100vw - 1280px)/2));gap:15px}.logo{font:800 23px Manrope;letter-spacing:-1.3px}.logo span{color:var(--teal)}.toplinks{display:flex;gap:18px;align-items:center;font-weight:700;font-size:12px}.toplinks a:hover{color:var(--teal)}.btn{border:0;background:var(--teal);color:#fff;padding:12px 18px;border-radius:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.secondary{background:#e9f4f1;color:#0b594f}.btn.danger{background:#fff1f1;color:#a83842}.layout{max-width:1320px;margin:auto;display:grid;grid-template-columns:265px minmax(0,1fr);min-height:calc(100vh - 76px)}aside{border-right:1px solid var(--line);background:#fff;padding:32px 18px}.aside-label{font-size:10px;font-weight:800;letter-spacing:2px;color:#9baeb3;margin:22px 13px 12px}.nav-btn{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:0;border-radius:11px;padding:14px;color:#526b73;font-weight:700;text-align:left}.nav-btn.active,.nav-btn:hover{background:#e7f6f1;color:#007f70}.avatar{width:52px;height:52px;background:#d4efe6;border-radius:16px;display:grid;place-items:center;color:#087e6d;font:800 21px Manrope}.side-user{display:flex;gap:12px;align-items:center;padding:10px 9px 20px;border-bottom:1px solid var(--line)}.side-user strong{display:block;overflow-wrap:anywhere}.side-user small{color:var(--muted);font-size:11px}.main{padding:42px clamp(20px,4vw,62px) 75px;min-width:0}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--teal);font-weight:800}.page-title{font:800 clamp(30px,3vw,42px) Manrope;letter-spacing:-1.7px;margin:10px 0}.subtitle{color:var(--muted);line-height:1.7;margin:0 0 30px}.welcome{background:linear-gradient(120deg,#092e3c,#126477);color:white;padding:32px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.welcome h2{font:800 25px Manrope;margin:0 0 10px}.welcome p{color:#c4dadd;max-width:510px;line-height:1.7}.welcome .btn{background:#72e2cb;color:#083c42}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:25px}.stat,.panel{border:1px solid var(--line);border-radius:16px;background:white;padding:23px}.stat .label{color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center}.stat strong{font:800 34px Manrope;display:block;margin-top:13px}.panel{margin:18px 0}.panel h3{font:800 18px Manrope;margin:0 0 18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.row-item{border-top:1px solid var(--line);padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}.row-item strong{display:block;margin-bottom:6px}.row-item small{color:var(--muted);line-height:1.6}.row-item .actions{display:flex;gap:7px;flex-wrap:wrap}.tiny{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;font-size:12px;font-weight:800}.tiny:hover{background:#f1f7f5}.empty{padding:28px 15px;text-align:center;color:var(--muted);line-height:1.8}.empty i{display:block;margin:auto auto 10px}.field{display:grid;gap:7px;margin:16px 0;max-width:550px}.field label{font-size:12px;font-weight:800}.field input,.field textarea{width:100%;padding:13px;border:1px solid #d8e5e7;border-radius:10px;background:white;color:#18333c}.field textarea{min-height:95px}.status{color:var(--teal);font-size:12px;margin:12px 0}.error{color:#b33746}.hidden{display:none!important}.auth{max-width:470px;margin:70px auto;background:#fff;border:1px solid var(--line);padding:35px;border-radius:22px}.auth h1{font:800 30px Manrope}.auth p{color:var(--muted);line-height:1.7}.auth .field{max-width:none}.auth .btn{width:100%;margin-top:12px}.auth-switch{background:none;border:0;color:var(--teal);font-weight:800;padding:14px 0}.danger-area{border-color:#f1d6d6}.mobile-nav{display:none}.footer-note{color:var(--muted);font-size:11px;margin-top:30px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:none}.main{padding:25px 20px 65px}.mobile-nav{display:flex;overflow:auto;gap:7px;background:white;padding:12px 20px;border-bottom:1px solid var(--line)}.mobile-nav .nav-btn{width:auto;white-space:nowrap;padding:10px 12px;font-size:12px}.top{padding:0 20px}.toplinks{gap:10px}}@media(max-width:580px){.logo{font-size:18px}.toplinks a:first-child{display:none}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{padding:13px}.stat strong{font-size:25px}.stat .label{font-size:10px}.welcome{padding:25px;display:block}.welcome h2{font-size:22px}.welcome .btn{margin-top:10px}.row-item{align-items:start;flex-direction:column}.auth{margin:35px 14px;padding:24px}}</style></head><body>
<header class="top"><a class="logo" href="index.html">nkomazi<span>connect.</span></a><nav class="toplinks"><a href="index.html">Community</a><a href="businesses.html">Explore businesses</a><button class="btn secondary" onclick="logout()" id="topLogout" style="display:none">Sign out</button></nav></header>
<div id="auth" class="auth hidden"><div class="eyebrow">YOUR NKOMAZI ACCOUNT</div><h1 id="authTitle">Welcome back.</h1><p id="authIntro">Sign in to manage your businesses, posts and personal details.</p><form onsubmit="submitAuth(event)"><div class="field hidden" id="nameField"><label>Your name</label><input id="authName" maxlength="70"></div><div class="field"><label>Email address</label><input id="authEmail" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="authPassword" type="password" required minlength="6" autocomplete="current-password"></div><button class="btn" id="authSubmit">Sign in to your account</button><p id="authMessage" class="status" role="status"></p></form><button class="auth-switch" onclick="toggleAuth()" id="authToggle">New here? Create an account</button></div>
<div id="dashboard" class="layout hidden"><aside><div class="side-user"><div class="avatar" id="avatar">N</div><div><strong id="sideName">Member</strong><small>Community member</small></div></div><div class="aside-label">YOUR WORKSPACE</div><div id="sideNav"></div></aside><div><nav class="mobile-nav" id="mobileNav"></nav><main class="main" id="main"></main></div></div>
<script>
const sb=window.supabase.createClient('https://akzcffayklqxdbeddtda.supabase.co','sb_publishable_2aZY685YD1HBcEkYH8un5w_8Y6neXZr');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const icon=()=>lucide.createIcons();let session=null,profile=null,businesses=[],posts=[],reviews=[],tab='overview',signup=false;
const tabs=[['overview','layout-dashboard','Overview'],['businesses','store','My businesses'],['posts','newspaper','My posts'],['reviews','star','My reviews'],['profile','user-round','My profile'],['settings','settings','Settings']];
function setTab(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function nav(){const h=tabs.map(([id,ico,label])=>'<button class="nav-btn '+(tab===id?'active':'')+'" onclick="setTab(\''+id+'\')"><i data-lucide="'+ico+'" width="18"></i>'+label+'</button>').join('');document.getElementById('sideNav').innerHTML=h;document.getElementById('mobileNav').innerHTML=h}
function title(eyebrow,heading,sub){return '<div class="eyebrow">'+eyebrow+'</div><h1 class="page-title">'+heading+'</h1><p class="subtitle">'+sub+'</p>'}
function item(name,meta,buttons){return '<div class="row-item"><div><strong>'+esc(name)+'</strong><small>'+esc(meta)+'</small></div><div class="actions">'+buttons+'</div></div>'}
function render(){if(!session)return;const name=profile?.display_name||session.user.user_metadata?.display_name||session.user.email.split('@')[0];document.getElementById('sideName').textContent=name;document.getElementById('avatar').textContent=name.charAt(0).toUpperCase();nav();let h='';
if(tab==='overview'){h=title('YOUR PERSONAL SPACE','Welcome back, '+esc(name)+'.','Everything you manage on Nkomazi Connect, all in one place.')+'<div class="welcome"><div><h2>Your community. Your opportunities.</h2><p>Keep your business visible, stay connected with local conversations and discover what is happening around you.</p><a href="businesses.html" class="btn">Explore local businesses <i data-lucide="arrow-up-right" width="17"></i></a></div><i data-lucide="network" width="72" height="72"></i></div><div class="stats"><div class="stat"><span class="label"><i data-lucide="store" width="15"></i> Businesses</span><strong>'+businesses.length+'</strong></div><div class="stat"><span class="label"><i data-lucide="newspaper" width="15"></i> Posts</span><strong>'+posts.length+'</strong></div><div class="stat"><span class="label"><i data-lucide="star" width="15"></i> Reviews</span><strong>'+reviews.length+'</strong></div></div><div class="panel"><div class="panel-head"><h3>Your businesses</h3><button class="tiny" onclick="setTab(\'businesses\')">View all</button></div>'+(businesses.length?businesses.slice(0,3).map(b=>item(b.name,b.category+' · '+b.town,'<a class="tiny" href="businesses.html">Manage</a>')).join(''):'<div class="empty">No businesses yet. Create your first listing to get discovered by local customers.</div>')+'<a href="businesses.html" class="btn secondary">Add a business <i data-lucide="arrow-up-right" width="15"></i></a></div>'}
if(tab==='businesses'){h=title('BUSINESS OWNER WORKSPACE','My businesses','Manage your business listings, cover images, contact details and customer visibility.')+'<div class="panel"><div class="panel-head"><h3>Your listings</h3><a href="businesses.html" class="btn">Add a business <i data-lucide="plus" width="16"></i></a></div>'+(businesses.length?businesses.map(b=>item(b.name,b.category+' · '+b.town+' · '+b.status,'<a class="tiny" href="businesses.html">Open directory</a>')).join(''):'<div class="empty">You haven\'t listed a business yet. Your business deserves to be discovered.</div>')+'</div><p class="subtitle">Business editing and deletion are available in the directory. A dedicated business management editor is coming next.</p>'}
if(tab==='posts'){h=title('COMMUNITY ACTIVITY','My posts','The updates and opportunities you have shared with Nkomazi.')+'<div class="panel"><div class="panel-head"><h3>Published posts</h3><a class="btn" href="index.html">Create a post <i data-lucide="plus" width="16"></i></a></div>'+(posts.length?posts.map(p=>item(p.title,p.category+' · '+(p.town||'Nkomazi')+' · '+new Date(p.created_at).toLocaleDateString('en-ZA'),'<a class="tiny" href="index.html">View community</a>')).join(''):'<div class="empty">You haven\'t shared anything yet.</div>')+'</div>'}
if(tab==='reviews'){h=title('YOUR FEEDBACK','My reviews','Keep track of the ratings and feedback you have shared with local businesses.')+'<div class="panel"><h3>Reviews written by you</h3>'+(reviews.length?reviews.map(r=>item(r.rating+'/5 stars',r.body||'No written comment','<a class="tiny" href="businesses.html">Explore directory</a>')).join(''):'<div class="empty">You haven\'t reviewed a business yet. Discover a local favourite and share your experience.</div>')+'</div>'}
if(tab==='profile'){h=title('PERSONAL INFORMATION','My profile','Choose how your name appears to other members of Nkomazi Connect.')+'<div class="panel"><h3>Profile details</h3><form onsubmit="saveProfile(event)"><div class="field"><label>Display name</label><input id="profileName" required minlength="2" maxlength="70" value="'+esc(name)+'"></div><div class="field"><label>Email address</label><input value="'+esc(session.user.email)+'" disabled></div><button class="btn">Save changes</button><p class="status" id="profileStatus" role="status"></p></form></div>'}
if(tab==='settings'){h=title('ACCOUNT PREFERENCES','Settings','Manage your account security and sign-in details.')+'<div class="panel"><h3>Account security</h3><p class="subtitle">Send a password reset link to your registered email address.</p><button class="btn secondary" onclick="resetPassword()">Send password reset email</button><p class="status" id="settingsStatus" role="status"></p></div><div class="panel danger-area"><h3>Sign out</h3><p class="subtitle">End your session on this device.</p><button class="btn danger" onclick="logout()">Sign out of Nkomazi Connect</button></div>'}
document.getElementById('main').innerHTML=h+'<p class="footer-note">Nkomazi Connect · Built for every community across Nkomazi</p>';icon()}
async function loadData(){if(!session)return;const id=session.user.id;const results=await Promise.all([sb.from('profiles').select('display_name').eq('id',id).maybeSingle(),sb.from('business_directory').select('id,name,category,town,status').eq('owner_id',id).order('created_at',{ascending:false}),sb.from('posts').select('id,title,category,town,created_at').eq('user_id',id).order('created_at',{ascending:false}),sb.from('business_reviews').select('id,rating,body,created_at').eq('user_id',id).order('created_at',{ascending:false})]);profile=results[0].data;businesses=results[1].data||[];posts=results[2].data||[];reviews=results[3].data||[];render()}
async function saveProfile(e){e.preventDefault();const name=document.getElementById('profileName').value.trim();const el=document.getElementById('profileStatus');if(name.length<2)return el.textContent='Please enter a name.';const {error}=await sb.from('profiles').upsert({id:session.user.id,display_name:name},{onConflict:'id'});if(error){el.textContent=error.message;el.classList.add('error');return}profile={display_name:name};el.textContent='Profile updated successfully.';document.getElementById('sideName').textContent=name;document.getElementById('avatar').textContent=name.charAt(0).toUpperCase()}
async function resetPassword(){const el=document.getElementById('settingsStatus');const {error}=await sb.auth.resetPasswordForEmail(session.user.email,{redirectTo:location.origin+location.pathname});el.textContent=error?error.message:'If the email is eligible, a password reset message will arrive shortly.'}
function toggleAuth(){signup=!signup;document.getElementById('nameField').classList.toggle('hidden',!signup);document.getElementById('authTitle').textContent=signup?'Join your community.':'Welcome back.';document.getElementById('authSubmit').textContent=signup?'Create your account':'Sign in to your account';document.getElementById('authToggle').textContent=signup?'Already have an account? Sign in':'New here? Create an account'}
async function submitAuth(e){e.preventDefault();const email=document.getElementById('authEmail').value,password=document.getElementById('authPassword').value,name=document.getElementById('authName').value.trim(),el=document.getElementById('authMessage');el.textContent='Please wait...';const res=signup?await sb.auth.signUp({email,password,options:{data:{display_name:name}}}):await sb.auth.signInWithPassword({email,password});if(res.error){el.textContent=res.error.message;el.classList.add('error');return}el.textContent=res.data.session?'Signed in successfully.':'Please check your email to confirm your account.'}
async function logout(){await sb.auth.signOut();session=null;showAuth()}
function showAuth(){document.getElementById('auth').classList.remove('hidden');document.getElementById('dashboard').classList.add('hidden');document.getElementById('topLogout').style.display='none'}
function showDashboard(){document.getElementById('auth').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');document.getElementById('topLogout').style.display='inline-flex';loadData()}
sb.auth.onAuthStateChange((_event,s)=>{const changed=session?.user.id!==s?.user.id;session=s;if(!s)showAuth();else if(changed)showDashboard()});sb.auth.getSession().then(({data})=>{session=data.session;if(session)showDashboard();else showAuth()});icon();
</script></body></html>
